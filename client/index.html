<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Juego WebSocket</title>
  <script type="module" src="script.js" defer></script>
</head>
<body>

  <header> <h1>Juego WebSocket</h1> </header>

  <div id="login">
    <label>Usuario:</label>
    <input type="text" id="nameInput" placeholder="Escribe tu nombre">
    <button id="joinBtn">Entrar</button>
  </div>

  <div id="chat">
    <div id="turn"></div>
    <ul id="messages"></ul>
    <input type="text" id="msgInput" placeholder="Escribe tu respuesta">
    <button id="sendBtn">Enviar</button>
  </div>

  <footer>
      <!-- Botón salir del juego -->
      <button class="btn-exit">Salir del juego</button> 
  </footer>

</body>
</html>
